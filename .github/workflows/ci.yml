name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # The runner's cached Node 22 can lag behind the patch release Astro requires.
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run check
